<!doctype html>
<!--
  Source for public/og.png (Spanish) and public/og-en.png (English), 1200 by 630.
  scripts/brand.mjs opens og.html?lang=es / ?lang=en in headless Chrome and
  screenshots it. Paths are relative to this file. Not served by the site.
-->
<html lang="es">
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: Inter; src: url('../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2') format('woff2'); font-weight: 100 900; }
* { box-sizing: border-box; margin: 0; }
html, body { width: 1200px; height: 630px; overflow: hidden; }
body { background: #f3f0e8; color: #181916; font-family: Inter, Arial, sans-serif; padding: 72px 80px 56px; display: flex; flex-direction: column; }
.lockup { height: 132px; width: auto; display: block; align-self: flex-start; margin-left: -4px; }
h1 { margin-top: 64px; max-width: 20ch; font-size: 60px; line-height: 1.08; font-weight: 600; letter-spacing: -0.035em; }
.foot { margin-top: auto; display: flex; justify-content: space-between; align-items: baseline; border-top: 2px solid #181916; padding-top: 20px; font: 500 22px/1.3 Consolas, 'Liberation Mono', monospace; color: #52554e; }
.foot b { font-weight: 600; color: #2947d7; }
</style>
</head>
<body>
  <img class="lockup" src="lockup.svg" alt="">
  <h1 id="t"></h1>
  <div class="foot"><span id="l"></span><b>barato, sí.</b></div>
<script>
  const copy = {
    es: { t: 'Las rebajas de hoy, con la evidencia a la vista.', l: 'Posibles errores de precio · JSON y RSS gratis' },
    en: { t: 'Today’s deepest US discounts, with the evidence.', l: 'Possible price errors · free JSON and RSS' },
  }
  const lang = new URLSearchParams(location.search).get('lang') === 'en' ? 'en' : 'es'
  document.documentElement.lang = lang
  document.getElementById('t').textContent = copy[lang].t
  document.getElementById('l').textContent = copy[lang].l
</script>
</body>
</html>

name: Refresh deals and deploy Pages
on:
  push:
    branches: [main]
  schedule:
    # Every three hours. Price errors are corrected within hours, so a twice-a-day
    # index missed most of them. The owner's PC also pushes at 06:35/18:35 local.
    - cron: '0 */3 * * *'
  workflow_dispatch:

concurrency:
  group: pages-main
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      # The committed lockfile is the only resolution CI performs. It is made on
      # Windows, so scripts/lockfile-platforms.mjs adds the Linux bindings npm
      # leaves out; this check fails early with instructions when it was skipped.
      - run: node scripts/lockfile-platforms.mjs --check
      - run: npm ci --no-audit --no-fund
      - run: npm run deals
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          ITAD_API_KEY: ${{ secrets.ITAD_API_KEY }}
          BESTBUY_API_KEY: ${{ secrets.BESTBUY_API_KEY }}
          WOOT_API_KEY: ${{ secrets.WOOT_API_KEY }}
      - run: npm test
      - run: npm run typecheck:lib
      - uses: actions/configure-pages@v5
      - run: npx nuxt generate
      - name: Commit refreshed data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ public/api public/errors.xml public/feed.xml public/llms.txt public/robots.txt public/sitemap.xml
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh deals [skip ci]'
            git push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

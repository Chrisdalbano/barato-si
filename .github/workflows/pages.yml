name: Refresh deals and deploy Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:

concurrency:
  group: pages-main
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: rm -f package-lock.json && npm install --no-audit --no-fund  # lockfile is generated on Windows and lacks Linux native bindings
      - run: npm run deals
      - run: npm test
      - run: npm run typecheck:lib
      - uses: actions/configure-pages@v5
      - run: npx nuxt generate
      - name: Commit refreshed data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/api public/feed.xml public/llms.txt public/robots.txt public/sitemap.xml
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh daily deals [skip ci]'
            git push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .output/public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
